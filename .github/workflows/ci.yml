name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build, tests and app bundle
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Render snapshots (demo data, both languages)
        continue-on-error: true
        run: |
          .build/release/UsageRings --snapshot snapshots/zh --demo-all --lang zh
          .build/release/UsageRings --snapshot snapshots/en --demo-all --lang en

      - name: Package universal app
        run: |
          zsh scripts/package.sh --release
          ditto -c -k --keepParent "dist/用量圈.app" dist/UsageRings-macOS.zip
          codesign --verify --deep --strict "dist/用量圈.app"
          lipo -archs "dist/用量圈.app/Contents/MacOS/UsageRings"
          test -f "dist/用量圈.app/Contents/Resources/AppIcon.icns"

      - name: Share snapshots (temporary)
        run: |
          mkdir -p ci-snapshots && cp -R snapshots/* ci-snapshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-snapshots && git commit -q -m "ci: snapshots (temporary)" && git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: UsageRings-macOS
          path: dist/UsageRings-macOS.zip

  linux:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
