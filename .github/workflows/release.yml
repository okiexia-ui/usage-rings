name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version="$(grep -m1 '^version=' scripts/package.sh | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in scripts/package.sh" >&2
            exit 1
          fi

      - name: Test, build and zip
        run: zsh scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " { if (found) exit; if (index($0, tag)) { found = 1; next } }
            found { print }' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/UsageRings-*-macOS.zip dist/UsageRings-*-macOS.zip.sha256 \
            --title "用量圈 $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
